name: Scheduled System Metrics Collector

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 12 hours automatically in GitHub's cloud
    - cron: '0 */12 * * *'

jobs:
  run-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Run Telemetry Script
        run: |
          python monitor.py --interval 2 --format md

      - name: Commit and Push Updated Snapshot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update system snapshot [skip ci]" && git push)
